<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Klasik Narde Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-notice">Daha iyi deneyim için telefonunuzu yatay çevirin</div>
    <div id="game-container">
        <!-- Üst Bilgi Paneli -->
        <div id="info-panel">
            <div id="panel-controls">
            <div id="turn-indicator"><span data-i18n="ui.turn">Sıra:</span> <span id="current-player">Beyaz</span></div>
            
            <!-- YENİ: Zorluk Seviyesi Seçici -->
            <div id="difficulty-container">
                <label for="bot-difficulty" data-i18n="ui.bot">Bot:</label>
                <select id="bot-difficulty">
                    <option value="easy" data-i18n="difficulty.easy">Kolay</option>
                    <option value="medium" data-i18n="difficulty.medium" selected>Orta</option>
                    <option value="hard" data-i18n="difficulty.hard">Usta</option>
                </select>
            </div>

            <div id="language-container">
                <label for="language-select" aria-label="Dil">
                    <span aria-hidden="true">🌐</span>
                </label>
                <select id="language-select" aria-label="Dil">
                    <option value="tr">Türkçe</option>
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                </select>
            </div>

            <div id="theme-container">
                <label for="theme-select" data-i18n="ui.theme">Tema:</label>
                <select id="theme-select" aria-label="Tema">
                    <option value="anatolian" data-i18n="theme.anatolian">Anadolu</option>
                    <option value="walnut" data-i18n="theme.walnut">Koyu Ceviz</option>
                </select>
            </div>

            <div id="timer-container">
                <div class="timer-title" data-i18n="ui.time">Kalan Süre</div>
                <div id="timer-countdown">60 sn</div>
            </div>
            
            <div id="dice-container">
                <div id="dice-display">
                    <span class="die" id="die1">-</span>
                    <span class="die" id="die2">-</span>
                </div>
            </div>
            
            </div>
            <div id="status-message" data-i18n="status.starting">Yeni oyun başlıyor...</div>
        </div>

        <!-- HTML5 Canvas Tavla Tahtası ve Orta Çıta Buttonları -->
        <div id="board-wrapper">
            <canvas id="game-canvas" width="800" height="600"></canvas>
            
            <!-- İlk hamleden sonra kısa süreli görünen tahta kontrolleri -->
            <div id="action-buttons" aria-hidden="true">
                <button id="undo-button" type="button" title="Geri Al" aria-label="Geri Al" tabindex="-1">↺</button>
                <button id="confirm-button" type="button" title="Hamleyi Bitir" aria-label="Hamleyi Bitir" tabindex="-1">✓</button>
            </div>
        </div>
    </div>

    <!-- YENİ: Başlangıç ekranı, oyuncu hazır olana kadar oyunu duraklatır -->
    <div id="start-screen" style="display: none;" aria-hidden="true">
        <div id="start-screen-box">
            <h2 data-i18n="ui.startTitle">Uzun Narde'ye Hoş Geldiniz</h2>
            <p data-i18n="ui.startDescription">Tahta hazır. Oyuna başlamak için Oyuna Başla'ya dokunun.</p>
            <button id="start-button" data-i18n="ui.startButton" type="button">Oyuna Başla</button>
        </div>
    </div>

    <!-- YENİ: Gelişmiş İstatistikli Game Over Paneli -->
    <div id="game-over-overlay" style="display: none;" aria-hidden="true">
        <div id="game-over-box">
            <h2 id="winner-title">Tebrikler!</h2>
            <p id="winner-message">Beyaz oyuncu oyunu kazandı!</p>
            
            <!-- Maç İstatistikleri Kartı -->
            <div id="match-stats">
                <p data-i18n="ui.matchSummary">📊 Maç Özeti</p>
                <div id="stats-details"><span data-i18n="ui.totalMoves">Toplam Hamle:</span> <span id="stat-moves">0</span></div>
            </div>

            <button id="restart-button" data-i18n="ui.startNewGame">Yeni Oyun Başlat</button>
        </div>
    </div>

    <!-- Oyunu Başlatan Ana Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
