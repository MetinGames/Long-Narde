<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasik Narde Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Üst Bilgi Paneli -->
        <div id="info-panel">
            <div id="turn-indicator"><span data-i18n="ui.turn">Sıra:</span> <span id="current-player">Beyaz</span></div>
            
            <!-- YENİ: Zorluk Seviyesi Seçici -->
            <div id="difficulty-container">
                <label for="bot-difficulty" data-i18n="ui.bot">Bot:</label>
                <select id="bot-difficulty">
                    <option value="easy" data-i18n="difficulty.easy">Kolay</option>
                    <option value="medium" data-i18n="difficulty.medium" selected>Orta</option>
                    <option value="hard" data-i18n="difficulty.hard">Usta</option>
                </select>
            </div>

            <div id="language-container">
                <label for="language-select" data-i18n="ui.language">Dil:</label>
                <select id="language-select" aria-label="Dil">
                    <option value="tr">Türkçe</option>
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                </select>
            </div>

            <div id="theme-container">
                <label for="theme-select" data-i18n="ui.theme">Tema:</label>
                <select id="theme-select" aria-label="Tema">
                    <option value="anatolian" data-i18n="theme.anatolian">Anadolu Ustası</option>
                    <option value="walnut" data-i18n="theme.walnut">Koyu Ceviz</option>
                </select>
            </div>

            <div id="timer-container"><span data-i18n="ui.time">Kalan Süre:</span> <span id="timer-countdown">60</span>s</div>
            
            <div id="dice-container">
                <div id="dice-display">
                    <span class="die" id="die1">-</span>
                    <span class="die" id="die2">-</span>
                </div>
            </div>
            
            <div id="status-message" data-i18n="status.starting">Yeni oyun başlıyor...</div>
        </div>

        <!-- HTML5 Canvas Tavla Tahtası ve Orta Çıta Buttonları -->
        <div id="board-wrapper">
            <canvas id="game-canvas" width="800" height="600"></canvas>
            
            <!-- Orta Çıtanın Üzerine Binen Minimalist Tuşlar -->
            <div id="action-buttons">
                <button id="undo-button" style="display: none;" title="Geri Al">↺</button>
                <button id="confirm-button" style="display: none;" title="Hamleyi Bitir">✓</button>
            </div>
        </div>
    </div>

    <!-- YENİ: Gelişmiş İstatistikli Game Over Paneli -->
    <div id="game-over-overlay" style="display: none;">
        <div id="game-over-box">
            <h2 id="winner-title">Tebrikler!</h2>
            <p id="winner-message">Beyaz oyuncu oyunu kazandı!</p>
            
            <!-- Maç İstatistikleri Kartı -->
            <div id="match-stats">
                <p data-i18n="ui.matchSummary">📊 Maç Özeti</p>
                <div id="stats-details"><span data-i18n="ui.totalMoves">Toplam Hamle:</span> <span id="stat-moves">0</span></div>
            </div>

            <button id="restart-button" data-i18n="ui.playAgain">Yeniden Oyna</button>
        </div>
    </div>

    <!-- Oyunu Başlatan Ana Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
