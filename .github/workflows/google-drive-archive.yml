name: Google Drive Archive

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      DRIVE_FOLDER_ID: 1OGRZ5m_-VPuNWiD4NmaGImf38Ri_NIQZ
      DRIVE_SHARED_DRIVE_ID: ${{ vars.DRIVE_SHARED_DRIVE_ID }}
      GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      PROJECT_NAME: Long-Narde

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build timestamped archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          SHORT_SHA="${GITHUB_SHA::7}"
          ARCHIVE="${PROJECT_NAME}_${TS}_${SHORT_SHA}.zip"
          MANIFEST="${ARCHIVE%.zip}.manifest.json"
          git archive --format=zip --output="$ARCHIVE" HEAD
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          printf '{\n  "repository": "%s",\n  "branch": "%s",\n  "commit": "%s",\n  "created_utc": "%s",\n  "workflow_run": "%s"\n}\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$TS" "$GITHUB_RUN_ID" > "$MANIFEST"
          printf '%s\n' "$ARCHIVE" > archive-name.txt
          printf '%s\n' "$MANIFEST" > manifest-name.txt
      - name: Keep temporary GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ github.run_number }}-${{ github.sha }}
          path: |
            *.zip
            *.sha256
            *.manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Install rclone
        if: >-
          env.GDRIVE_RCLONE_CONFIG != '' ||
          env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Configure Google Drive remote
        if: >-
          env.GDRIVE_RCLONE_CONFIG != '' ||
          env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_PATH="$RUNNER_TEMP/rclone.conf"

          if [[ -n "$GDRIVE_RCLONE_CONFIG" ]]; then
            printf '%s' "$GDRIVE_RCLONE_CONFIG" > "$CONFIG_PATH"
            if ! grep -Eq '^\[gdrive\][[:space:]]*$' "$CONFIG_PATH"; then
              echo "::error::GDRIVE_RCLONE_CONFIG must contain a [gdrive] remote."
              exit 1
            fi
          else
            if [[ -z "$DRIVE_SHARED_DRIVE_ID" ]]; then
              echo "::error::Google service accounts have no My Drive storage quota. Configure GDRIVE_RCLONE_CONFIG for user OAuth, or set DRIVE_SHARED_DRIVE_ID for a Shared Drive."
              exit 1
            fi

            SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/gdrive-service-account.json"
            printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$SERVICE_ACCOUNT_PATH"
            chmod 600 "$SERVICE_ACCOUNT_PATH"
            cat > "$CONFIG_PATH" <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = $SERVICE_ACCOUNT_PATH
          root_folder_id = $DRIVE_FOLDER_ID
          team_drive = $DRIVE_SHARED_DRIVE_ID
          EOF
          fi

          chmod 600 "$CONFIG_PATH"
          printf '%s\n' "$CONFIG_PATH" > rclone-config-path.txt
      - name: Upload and verify archive in Google Drive
        if: >-
          env.GDRIVE_RCLONE_CONFIG != '' ||
          env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_PATH="$(cat rclone-config-path.txt)"
          ARCHIVE="$(cat archive-name.txt)"
          MANIFEST="$(cat manifest-name.txt)"
          rclone copyto "$ARCHIVE" "gdrive:$ARCHIVE" --config "$CONFIG_PATH" --checksum --drive-chunk-size 64M
          rclone copyto "$ARCHIVE.sha256" "gdrive:$ARCHIVE.sha256" --config "$CONFIG_PATH" --checksum
          rclone copyto "$MANIFEST" "gdrive:$MANIFEST" --config "$CONFIG_PATH" --checksum

          REMOTE_FILES="$(rclone lsf gdrive: --config "$CONFIG_PATH" --files-only)"
          for FILE in "$ARCHIVE" "$ARCHIVE.sha256" "$MANIFEST"; do
            grep -Fx "$FILE" <<< "$REMOTE_FILES"
          done
      - name: Explain inactive Drive upload
        if: >-
          env.GDRIVE_RCLONE_CONFIG == '' &&
          env.GDRIVE_SERVICE_ACCOUNT_JSON == ''
        run: >-
          echo "Drive upload skipped. Add GDRIVE_RCLONE_CONFIG for user OAuth,
          or pair GDRIVE_SERVICE_ACCOUNT_JSON with a Shared Drive ID."
